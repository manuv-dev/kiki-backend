spring.application.name=api_kikitraiteur
# Charge .env en local (ignoré sur Render car le fichier n'existe pas)
spring.config.import=optional:file:.env[.properties]

# Database Configuration (Neon DB via .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Settings (Optimisé pour Neon DB / PostgreSQL)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=150000
spring.datasource.hikari.validation-timeout=3000

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# =============================================
# JWT Configuration
# =============================================
# Secret d'au moins 256 bits (32 caractères) — à surcharger via .env
jwt.secret=${JWT_SECRET:KikiTraiteurSecretKey2026SuperSecureJWTSigningKey!}
# Expiration : 24h (86400000 ms)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================
# SMTP Configuration (Gmail - Phase de dev)
# =============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =============================================
# Google Calendar Sync (optionnel — via .env)
# =============================================
google.calendar.client-id=${GOOGLE_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET:}
google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:primary}
google.calendar.tokens-dir=${GOOGLE_TOKENS_DIR:tokens}

# =============================================
# Upload de fichiers (Médiathèque)
# =============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
media.upload.dir=${MEDIA_UPLOAD_DIR:uploads/media}
