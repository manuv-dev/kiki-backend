spring.application.name=api_kikitraiteur
# Sur Render: les variables DB_URL, DB_USERNAME, DB_PASSWORD sont injectées via Environment Variables
# En local: utiliser .env (ignoré par git)

# Database Configuration (Neon DB via .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080
